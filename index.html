<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0C0D">
    <title>Mykora</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #0A0C0D;
            --text: #F4F5F5;
            --muted: #9BA3A8;
            --line: rgba(255, 255, 255, 0.14);
            --in: #C9A26B;
            --out: #9AD7FF;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --dock-h: calc(312px + var(--safe-b));
        }
        html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
        body {
            display: grid; grid-template-rows: minmax(0, 1fr) var(--dock-h); height: 100dvh;
            background: var(--bg); color: var(--text);
            font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-text-size-adjust: 100%;
        }
        h1, h2, p { margin: 0; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

        /* visor: su tamaño no depende del panel, así que nada se mueve al tocar */
        #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
        canvas { display: block; }
        #brand {
            position: absolute; z-index: 1; pointer-events: none; font-size: 15px; font-weight: 600;
            top: calc(14px + var(--safe-t)); left: calc(16px + var(--safe-l));
        }
        #progress {
            position: absolute; z-index: 1; left: 0; bottom: 0; width: 100%; height: 2px; display: block;
            appearance: none; border: 0; background: none; color: var(--text);
        }
        #progress::-webkit-progress-bar { background: none; }
        #progress::-webkit-progress-value { background: var(--text); }
        #progress::-moz-progress-bar { background: var(--text); }
        .ready #progress { display: none; }
        #error {
            position: absolute; z-index: 2; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px; text-align: center;
        }
        #reload {
            appearance: none; font: inherit; color: var(--text); background: none; border: 1px solid var(--text);
            border-radius: 0; min-height: 44px; padding: 0 16px; cursor: pointer;
        }

        /* panel: altura fija; solo cambia el contenido de su última zona */
        #dock {
            box-sizing: border-box; min-height: 0; display: flex; flex-direction: column; gap: 10px;
            padding: 12px calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
            border-top: 1px solid var(--line);
        }
        .label { display: block; font-size: 12px; color: var(--muted); }
        .unit { font-size: 13px; font-weight: 400; color: var(--muted); }

        #flow { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .q { display: block; font-size: 24px; font-weight: 600; line-height: 1.2; }
        #q-in { color: var(--in); }
        #q-out { color: var(--out); }

        #layers { flex: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
        .layer {
            appearance: none; font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
            border-radius: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column; gap: 4px; min-width: 0;
        }
        .layer:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        .swatch {
            display: block; aspect-ratio: 1; background-size: cover; background-position: center;
            filter: saturate(0.25) brightness(0.55); transition: filter 0.4s;
        }
        .layer.is-wet .swatch { filter: none; }
        .layer[aria-pressed="true"] .swatch { outline: 2px solid var(--text); outline-offset: -2px; filter: none; }
        .layer-name { font-size: 11px; line-height: 1.2; color: var(--muted); min-height: 2.4em; }
        .layer[aria-pressed="true"] .layer-name { color: var(--text); }
        .layer-time { font-size: 13px; font-weight: 600; }

        #panel { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; border-top: 1px solid var(--line); padding-top: 10px; }
        /* el total llena el panel en reposo: la nota queda abajo, sin hueco muerto */
        #balance { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr; gap: 6px; min-height: 100%; }
        .total { display: block; font-size: 20px; font-weight: 600; line-height: 1.25; }
        #note { grid-column: 1 / -1; align-self: end; font-size: 12px; color: var(--muted); }

        #detail { position: relative; }
        #capa-nombre { font-size: 16px; font-weight: 600; line-height: 1.25; padding-right: 36px; }
        #return-layer {
            position: absolute; top: -10px; right: -2px; width: 44px; height: 44px; padding: 12px; display: block;
            appearance: none; color: var(--text); background: none; border: 0; border-radius: 0; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #return-layer:focus-visible, #reload:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        #return-layer svg { display: block; width: 20px; height: 20px; }
        #capa-funcion { margin-top: 4px; }
        #capa-mecanismo { margin-top: 4px; font-size: 13px; color: var(--muted); }

        @media (max-height: 700px) and (orientation: portrait) {
            :root { --dock-h: calc(296px + var(--safe-b)); }
            #dock { gap: 8px; padding-top: 10px; }
            .q { font-size: 20px; }
            #panel { padding-top: 8px; }
        }

        /* apaisado y escritorio: el panel pasa al lado derecho, igual de fijo */
        @media (min-width: 900px), (orientation: landscape) and (max-height: 560px) {
            body { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 340px; }
            #dock { border-top: 0; border-left: 1px solid var(--line); padding-left: 16px; }
        }
        @media (orientation: landscape) and (max-height: 560px) and (max-width: 899px) {
            #dock { gap: 8px; padding-top: 10px; padding-bottom: 10px; }
            .q { font-size: 20px; }
            .layer-name { display: none; }
            #panel { padding-top: 8px; }
        }
        @media (min-width: 900px) {
            body { grid-template-columns: minmax(0, 1fr) 400px; }
            #dock { padding: 24px 24px 24px 24px; gap: 20px; }
            .q { font-size: 28px; }
            #layers { grid-template-columns: 1fr; gap: 0; }
            .layer { flex-direction: row; align-items: center; gap: 12px; padding: 4px 0; }
            .swatch { flex: 0 0 44px; width: 44px; }
            .layer-name { flex: 1; min-height: 0; font-size: 14px; color: var(--text); }
            .layer-time { font-weight: 400; }
            .layer:hover .layer-name { text-decoration: underline; }
            #capa-nombre { font-size: 18px; }
            #panel { padding-top: 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <main id="stage">
        <h1 id="brand">Mykora</h1>
        <progress id="progress" max="100" value="0" aria-label="Carga del modelo"></progress>
        <div id="error" hidden>
            <p>No se pudo cargar.</p>
            <button id="reload" type="button">Reintentar</button>
        </div>
    </main>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <section id="dock" aria-label="Caudal y capas">
        <div id="flow">
            <div><span class="label">Entra</span><span class="q"><span id="q-in">—</span> <span class="unit">mL/s</span></span></div>
            <div><span class="label">Sale</span><span class="q"><span id="q-out">—</span> <span class="unit">mL/s</span></span></div>
        </div>
        <div id="layers"></div>
        <div id="panel">
            <div id="balance">
                <div><span class="total"><span id="v-in">—</span> <span class="unit">mL</span></span><span class="label">Entró</span></div>
                <div><span class="total"><span id="v-held">—</span> <span class="unit">mL</span></span><span class="label">En el filtro</span></div>
                <div><span class="total"><span id="v-out">—</span> <span class="unit">mL</span></span><span class="label">Salió</span></div>
                <p id="note">Simulación con valores estimados.</p>
            </div>
            <div id="detail" hidden>
                <h2 id="capa-nombre"></h2>
                <button id="return-layer" type="button" aria-label="Devolver la capa al filtro">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
                <p id="capa-funcion"></p>
                <p id="capa-mecanismo"><span id="capa-proporcion"></span>. <span id="capa-tipo"></span></p>
            </div>
        </div>
    </section>

    <!-- Script clásico: si el CDN falla, el módulo nunca corre y nadie más avisaría. -->
    <script>
        window.mykoraFail = function (error) {
            if (error) console.error(error);
            window.mykoraFailed = true;
            document.getElementById('progress').hidden = true;
            document.getElementById('error').hidden = false;
            document.getElementById('error').setAttribute('role', 'alert');
        };
        document.getElementById('reload').addEventListener('click', function () { location.reload(); });
        setTimeout(function () { if (!window.mykoraStarted) window.mykoraFail(); }, 15000);
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
        import { FilterModel } from './physics.js';

        window.mykoraStarted = true;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Carcasa translúcida en tono perla/gris (antes era azul).
        const SHELL_COLOR = "#dcd7cc";

        // Textura granular real de cada capa (carpeta ./textures), mapeada por la
        // posición física de la cápsula: de arriba (capa 1) hacia abajo (capa 6).
        const CAPSULE_TEXTURES = {
            'Capsula_6': 'textures/1.png', // Capa 1 · Grava gruesa de sílice  (arriba)
            'Capsula_2': 'textures/2.png', // Capa 2 · Arena de sílice
            'Capsula_5': 'textures/3.png', // Capa 3 · Zeolita clinoptilolita
            'Capsula_4': 'textures/4.png', // Capa 4 · Hierro de valencia cero (ZVI)
            'Capsula_1': 'textures/5.png', // Capa 5 · Biochar + micelio de P. ostreatus
            'Capsula_3': 'textures/6.png'  // Capa 6 · Grava fina de sílice   (abajo)
        };

        // Datos verídicos del prototipo terrestre de Mykora
        // (Presentación "Mykora By Borregolitos": prototipo terrestre p.11,
        //  arquitectura y función de capas p.24, modelo matemático p.26).
        const CAPSULE_DB = {
            'Capsula_6': { nombre: 'Capa 1 · Grava gruesa de sílice', mecanismo: 'Filtración física (pretratamiento)', funcion: 'Captura partículas sólidas grandes y mantiene el flujo del lecho.', proporcion: '15% del lecho' },
            'Capsula_2': { nombre: 'Capa 2 · Arena de sílice', mecanismo: 'Filtración de lecho profundo (modelo de Iwasaki)', funcion: 'Retiene partículas finas; mezclada con el ZVI evita la colmatación.', proporcion: '20% del lecho' },
            'Capsula_5': { nombre: 'Capa 3 · Zeolita clinoptilolita', mecanismo: 'Intercambio iónico (modelo de Bohart–Adams)', funcion: 'Intercambia iones en su estructura porosa para retener contaminantes.', proporcion: '15% del lecho' },
            'Capsula_4': { nombre: 'Capa 4 · Hierro de valencia cero (ZVI)', mecanismo: 'Reducción química (cinética de pseudo-primer orden)', funcion: 'Reduce y precipita los contaminantes disueltos en el agua.', proporcion: '10% del lecho' },
            'Capsula_1': { nombre: 'Capa 5 · Biochar + micelio de P. ostreatus', mecanismo: 'Adsorción + biorremediación (modelo de Langmuir, pseudo-segundo orden)', funcion: 'Adsorbe y biodegrada contaminantes mediante el micelio de P. ostreatus.', proporcion: '30% del lecho' },
            'Capsula_3': { nombre: 'Capa 6 · Grava fina de sílice', mecanismo: 'Filtración / pulido final', funcion: 'Pulido final del agua y estabilización de la salida del sistema.', proporcion: '10% del lecho' }
        };

        const ASSETS = [
            { id: 'filtroMarte', obj: 'models/filtroMarte.obj', mtl: 'models/filtroMarte.mtl' },
            { id: 'Capsula_1', obj: 'models/capsula2.obj', mtl: 'models/capsula2.mtl' },
            { id: 'Capsula_2', obj: 'models/capsula3.obj', mtl: 'models/capsula3.mtl' },
            { id: 'Capsula_3', obj: 'models/capsula3a.obj', mtl: 'models/capsula3a.mtl' },
            { id: 'Capsula_4', obj: 'models/capsula3a.obj', mtl: 'models/capsula3a.mtl' },
            { id: 'Capsula_5', obj: 'models/capsula4.obj', mtl: 'models/capsula4.mtl' },
            { id: 'Capsula_6', obj: 'models/capsulaXS.obj', mtl: 'models/capsulaXS.mtl' }
        ];

        // Agua: geometría medida de los .obj (1 unidad = 1 mm). El eje de los cuellos
        // de entrada y salida está en z = 6.4. El tubo de alimentación queda a la misma
        // distancia de caída que la salida para poder comparar los dos chorros.
        const WATER = {
            axisZ: 6.4,
            nozzleY: 150,
            nozzleRadius: 8,
            bedTop: 69.6,
            bedBottom: -50.4,
            streamBottom: -320,
            pondRadius: 14.6,
            maxPondHeight: 10,
            maxInflow: 15000,
            gravity: 9810,
            nozzleSpeed: 100,
            gapSpeed: 400
        };

        // 6 capas + 5 huecos entre ellas
        const SEGMENT_COUNT = 11;

        // GLSL común: perfil del lecho (poros acumulados, altura y turbidez por segmento).
        const WATER_GLSL_COMMON = `
            uniform float uSegPore[${SEGMENT_COUNT + 1}];
            uniform float uSegY[${SEGMENT_COUNT + 1}];
            uniform float uSegC[${SEGMENT_COUNT + 1}];
            vec3 waterTint(float c) {
                return mix(vec3(0.80, 0.93, 1.0), vec3(0.42, 0.30, 0.16), c);
            }
            float turbidityAt(float y) {
                if (y >= uSegY[0]) return 1.0;
                for (int i = 0; i < ${SEGMENT_COUNT}; i++) {
                    if (y >= uSegY[i + 1]) {
                        return mix(uSegC[i], uSegC[i + 1], (uSegY[i] - y) / max(uSegY[i] - uSegY[i + 1], 0.001));
                    }
                }
                return uSegC[${SEGMENT_COUNT}];
            }
        `;

        const WATER_GLSL_NOISE = `
            float wHash(vec3 p) {
                p = fract(p * 0.3183099 + 0.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }
            float wNoise(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(
                    mix(mix(wHash(i), wHash(i + vec3(1, 0, 0)), f.x), mix(wHash(i + vec3(0, 1, 0)), wHash(i + vec3(1, 1, 0)), f.x), f.y),
                    mix(mix(wHash(i + vec3(0, 0, 1)), wHash(i + vec3(1, 0, 1)), f.x), mix(wHash(i + vec3(0, 1, 1)), wHash(i + vec3(1, 1, 1)), f.x), f.y),
                    f.z
                );
            }
        `;

        // Parcelas de agua en los poros: la posición sale del volumen de poros recorrido,
        // así van más lentas en las capas con más poros por unidad de altura.
        const TRACER_VERTEX = `
            attribute vec3 aSeed;
            uniform float uThroughput;
            uniform float uSegZ[${SEGMENT_COUNT}];
            uniform float uSegRadius[${SEGMENT_COUNT}];
            uniform float uPointScale;
            ${WATER_GLSL_COMMON}
            varying float vY;
            varying float vInLayer;
            void main() {
                float pore = fract(aSeed.x + uThroughput) * uSegPore[${SEGMENT_COUNT}];
                vY = uSegY[${SEGMENT_COUNT}];
                float centerZ = 0.0;
                float radius = 0.0;
                vInLayer = 0.0;
                for (int i = 0; i < ${SEGMENT_COUNT}; i++) {
                    if (pore <= uSegPore[i + 1]) {
                        vY = mix(uSegY[i], uSegY[i + 1], (pore - uSegPore[i]) / max(uSegPore[i + 1] - uSegPore[i], 0.001));
                        centerZ = uSegZ[i];
                        radius = uSegRadius[i];
                        // los índices pares son capas; los impares, huecos
                        vInLayer = 1.0 - mod(float(i), 2.0);
                        break;
                    }
                }
                float angle = aSeed.z * 6.2832;
                vec4 mv = modelViewMatrix * vec4(cos(angle) * radius, vY, centerZ + sin(angle) * radius, 1.0);
                gl_PointSize = uPointScale * (0.7 + 0.8 * aSeed.y) * 800.0 / -mv.z;
                gl_Position = projectionMatrix * mv;
            }
        `;

        const TRACER_FRAGMENT = `
            uniform float uFront;
            varying float vY;
            varying float vInLayer;
            void main() {
                if (vY < uFront || vInLayer < 0.5) discard;
                float d = length(gl_PointCoord - 0.5) * 2.0;
                gl_FragColor = vec4(0.85, 0.93, 1.0, (1.0 - smoothstep(0.2, 1.0, d)) * 0.75);
            }
        `;

        // Gotas sueltas: salpicadura al caer en el cuello y rotura del chorro de salida.
        const DROP_VERTEX = `
            attribute vec3 aSeed;
            uniform float uTime;
            uniform float uRate;
            uniform float uY;
            uniform float uUp;
            uniform float uDrop;
            uniform float uSpread;
            uniform float uCenterZ;
            uniform float uSize;
            uniform float uPointScale;
            void main() {
                float phase = fract(aSeed.x + uTime * uRate * (0.7 + 0.6 * aSeed.y));
                float y = uY + uUp * 4.0 * phase * (1.0 - phase) * aSeed.y - uDrop * phase * phase;
                float angle = aSeed.z * 6.2832;
                float r = uSpread * phase * (0.3 + 0.7 * aSeed.y);
                vec4 mv = modelViewMatrix * vec4(cos(angle) * r, y, uCenterZ + sin(angle) * r, 1.0);
                gl_PointSize = uPointScale * uSize * (0.6 + 0.8 * aSeed.y) * 340.0 / -mv.z;
                gl_Position = projectionMatrix * mv;
            }
        `;

        const DROP_FRAGMENT = `
            uniform float uAmount;
            uniform vec3 uColor;
            void main() {
                float d = length(gl_PointCoord - 0.5) * 2.0;
                float alpha = (1.0 - smoothstep(0.3, 1.0, d)) * uAmount;
                if (alpha < 0.01) discard;
                gl_FragColor = vec4(uColor, alpha);
            }
        `;

        const DOM = {
            stage: document.getElementById('stage'),
            progress: document.getElementById('progress'),
            layers: document.getElementById('layers'),
            balance: document.getElementById('balance'),
            detail: document.getElementById('detail'),
            live: document.getElementById('live'),
            nombre: document.getElementById('capa-nombre'),
            mecanismo: document.getElementById('capa-tipo'),
            funcion: document.getElementById('capa-funcion'),
            proporcion: document.getElementById('capa-proporcion'),
            returnLayer: document.getElementById('return-layer'),
            qIn: document.getElementById('q-in'),
            qOut: document.getElementById('q-out'),
            vIn: document.getElementById('v-in'),
            vHeld: document.getElementById('v-held'),
            vOut: document.getElementById('v-out')
        };

        // Nombres cortos para la fila de capas; el nombre completo sale de CAPSULE_DB.
        const LAYER_SHORT = {
            'Capsula_6': 'Grava gruesa',
            'Capsula_2': 'Arena',
            'Capsula_5': 'Zeolita',
            'Capsula_4': 'Hierro',
            'Capsula_1': 'Biochar',
            'Capsula_3': 'Grava fina'
        };

        const state = {
            selectedId: null,
            objects: {},
            targets: {},
            rows: {}
        };

        // Encuadre fijo: el filtro y un tramo igual de chorro arriba y abajo
        const FRAME = {
            fov: 28, elevation: 8, halfWidth: 46, margin: 1.04,
            // en vertical el filtro aprovecha el alto; un poco más de aire abajo para la cápsula extraída
            portrait: { halfHeight: 98, targetY: -8 },
            wide: { halfHeight: 112, targetY: 0 }
        };

        // Distancia de salida de una cápsula: libra la carcasa (44) sin tapar las capas vecinas.
        // frontEdge es lo que sobresale su frente del eje del filtro antes de salir.
        const POP_OUT = { min: 46, max: 65, frontEdge: 24 };

        let scene, camera, renderer, controls;
        const SCENE_COLOR = 0x0A0C0D;
        const frameClock = new THREE.Clock();
        const frameStats = { sum: 0, count: 0 };
        const manager = new THREE.LoadingManager();
        const texLoader = new THREE.TextureLoader(manager);

        // archivos previstos: .mtl y .obj por pieza más las seis texturas
        const EXPECTED_FILES = ASSETS.length * 2 + Object.keys(CAPSULE_TEXTURES).length;
        // Una red atascada no da error: sin progreso, se avisa en vez de cargar para siempre.
        const LOAD_STALL_MS = 30000;
        let loadWatchdog = setTimeout(window.mykoraFail, LOAD_STALL_MS);
        manager.onProgress = (url, loaded) => {
            if (window.mykoraFailed) return;
            clearTimeout(loadWatchdog);
            loadWatchdog = setTimeout(window.mykoraFail, LOAD_STALL_MS);
            DOM.progress.value = Math.min(100, Math.round(loaded / EXPECTED_FILES * 100));
        };
        manager.onError = window.mykoraFail;

        // Las capas se dibujan desde el primer momento para que el panel no salte al cargar.
        Object.keys(CAPSULE_TEXTURES).forEach((id) => {
            const swatch = document.createElement('span');
            swatch.className = 'swatch';
            swatch.style.backgroundImage = `url(${CAPSULE_TEXTURES[id]})`;
            const name = document.createElement('span');
            name.className = 'layer-name';
            name.textContent = LAYER_SHORT[id];
            const time = document.createElement('span');
            time.className = 'layer-time';
            time.id = `time-${id}`;
            time.textContent = '—';
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'layer';
            button.setAttribute('aria-pressed', 'false');
            button.setAttribute('aria-label', layerTitle(id));
            button.setAttribute('aria-describedby', time.id);
            button.append(swatch, name, time);
            button.addEventListener('click', () => selectLayer(id));
            DOM.layers.appendChild(button);
            state.rows[id] = { button, time };
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(SCENE_COLOR);

            camera = new THREE.PerspectiveCamera(FRAME.fov, 1, 1, 2500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            DOM.stage.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = !reducedMotion;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 1.8;
            controls.target.set(0, FRAME.wide.targetY, WATER.axisZ);
            const elevation = THREE.MathUtils.degToRad(FRAME.elevation);
            camera.position.set(0, Math.sin(elevation), Math.cos(elevation)).add(controls.target);

            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            const directional = new THREE.DirectionalLight(0xffffff, 2.6);
            directional.position.set(200, 300, 150);
            const backLight = new THREE.DirectionalLight(0xffffff, 1.0);
            backLight.position.set(-150, 100, -200);
            scene.add(ambient, directional, backLight);

            const promises = ASSETS.map(item => {
                return new Promise((resolve) => {
                    new MTLLoader(manager).load(item.mtl, (materials) => {
                        materials.preload();
                        new OBJLoader(manager).setMaterials(materials).load(item.obj, (obj) => {
                            obj.name = item.id;
                            state.targets[item.id] = 0;
                            
                            const isShell = item.id === 'filtroMarte';
                            obj.traverse((child) => {
                                if (child.isMesh) {
                                    // los .obj no traen normales: se calculan para la luz, conservando
                                    // las aristas; la posición de los vértices no cambia
                                    child.geometry = toCreasedNormals(child.geometry, THREE.MathUtils.degToRad(35));
                                    // tanto la carcasa exterior como cada cápsula son contenedores
                                    // translúcidos; el material real va en un cilindro interno.
                                    child.material = shellMaterial(isShell ? 0.05 : 0.08, isShell ? 0.55 : 0.45);
                                }
                            });
                                                        resolve({ id: item.id, obj });
                        }, undefined, window.mykoraFail);
                    }, undefined, window.mykoraFail);
                });
            });

            Promise.all(promises).then((results) => {
                results.forEach(res => {
                    state.objects[res.id] = res.obj;
                    scene.add(res.obj);
                });

                state.objects['filtroMarte'].position.set(0.0, 71.0, 6.4);
                state.objects['Capsula_1'].position.set(0.0, -34.2, 0.0);
                state.objects['Capsula_2'].position.set(0.0, 31.6, 0.0);
                state.objects['Capsula_3'].position.set(0.0, -48.4, 0.0);
                state.objects['Capsula_4'].position.set(0.0, -7.4, 0.0);
                state.objects['Capsula_5'].position.set(0.0, 7.6, 0.0);
                state.objects['Capsula_6'].position.set(0.0, 51.6, 0.0);

                ASSETS.forEach(p => {
                    if (p.id !== 'filtroMarte') state.objects[p.id].rotation.set(-1.571, 0, 0);
                });

                // Cilindro de material dentro de cada cápsula: ese es el que lleva la
                // textura granular real. La cápsula queda como contenedor translúcido.
                state.cylinders = {};
                state.cylBaseZ = {};
                const textures = [];
                scene.updateMatrixWorld(true);
                ASSETS.forEach(p => {
                    if (p.id === 'filtroMarte') return;
                    const obj = state.objects[p.id];
                    const box = new THREE.Box3().setFromObject(obj);
                    const size = new THREE.Vector3(); box.getSize(size);
                    const center = new THREE.Vector3(); box.getCenter(center);

                    let tex;
                    textures.push(new Promise((resolve) => {
                        tex = texLoader.load(CAPSULE_TEXTURES[p.id], resolve, undefined, window.mykoraFail);
                    }));
                    tex.colorSpace = THREE.SRGBColorSpace;
                    // en espejo: el cilindro no muestra costura de frente
                    tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping;
                    tex.repeat.set(2, 1);
                    tex.offset.x = 0.5;
                    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                    const cyl = new THREE.Mesh(
                        new THREE.CylinderGeometry(1, 1, 1, 48),
                        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0.0, envMapIntensity: 0.5 })
                    );
                    // ajustamos el cilindro (eje Y vertical) al hueco de la cápsula:
                    // radio según el footprint X/Z y altura según el grosor Y.
                    cyl.scale.set((size.x / 2) * 0.88, size.y * 0.82, (size.z / 2) * 0.88);
                    cyl.position.copy(center);
                    cyl.name = p.id; // permite seleccionar la cápsula al hacer click en el material
                    scene.add(cyl);
                    state.cylinders[p.id] = cyl;
                    state.cylBaseZ[p.id] = center.z;
                });

                createWater();

                // Detección de "tap" con Pointer Events: funciona igual en escritorio
                // y en móvil. El evento "click" sintético no es fiable en muchos
                // navegadores móviles porque OrbitControls captura el touch y llama
                // a preventDefault, cancelando el click.
                const TAP_MOVE_THRESHOLD = 10; // px de tolerancia para considerar tap (no arrastre)
                let pointerDown = null;

                renderer.domElement.addEventListener('pointerdown', (e) => {
                    pointerDown = { x: e.clientX, y: e.clientY };
                });
                renderer.domElement.addEventListener('pointerup', (e) => {
                    if (!pointerDown) return;
                    const moved = Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y);
                    pointerDown = null;
                    if (moved <= TAP_MOVE_THRESHOLD) onTap(e);
                });
                // si el gesto se cancela (p. ej. multitouch), no lo tratamos como tap
                renderer.domElement.addEventListener('pointercancel', () => { pointerDown = null; });

                DOM.returnLayer.addEventListener('click', () => returnSelected());
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') returnSelected();
                });

                new ResizeObserver(onResize).observe(DOM.stage);
                onResize();

                // sin arrancar hasta tener texturas: así nunca se ven capas negras
                return Promise.all(textures).then(tick);
            }).catch(window.mykoraFail);
        }

        // Vidrio de carcasa y cápsulas: casi invisible de frente y visible en los bordes,
        // en vez de un velo uniforme que lava lo que hay dentro.
        function shellMaterial(alphaMin, alphaMax) {
            const material = new THREE.MeshStandardMaterial({
                color: SHELL_COLOR,
                transparent: true,
                depthWrite: false,
                roughness: 0.18,
                metalness: 0.05,
                side: THREE.DoubleSide,
                forceSinglePass: true
            });
            material.onBeforeCompile = (shader) => {
                shader.uniforms.uAlphaMin = { value: alphaMin };
                shader.uniforms.uAlphaMax = { value: alphaMax };
                shader.fragmentShader = `
                    uniform float uAlphaMin;
                    uniform float uAlphaMax;
                ` + shader.fragmentShader.replace('#include <opaque_fragment>', `
                    diffuseColor.a = mix(uAlphaMin, uAlphaMax, pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 2.5));
                    #include <opaque_fragment>
                `);
            };
            return material;
        }

        function createWater() {
            const order = Object.keys(state.cylinders)
                .sort((a, b) => state.cylinders[b].position.y - state.cylinders[a].position.y);

            // El alto de cada capa sale de su proporción del lecho; los huecos, de las cápsulas reales.
            const capsuleBoxes = order.map(id => new THREE.Box3().setFromObject(state.objects[id]));
            const bedLength = capsuleBoxes.reduce((sum, b) => sum + (b.max.y - b.min.y), 0);
            const segments = [];
            const visualY = [];
            order.forEach((id, i) => {
                const cyl = state.cylinders[id];
                visualY.push(cyl.position.y + cyl.scale.y / 2, cyl.position.y - cyl.scale.y / 2);
                segments.push({ id, length: bedLength * parseFloat(CAPSULE_DB[id].proporcion) / 100 });
                if (i < order.length - 1) {
                    segments.push({ length: capsuleBoxes[i].min.y - capsuleBoxes[i + 1].max.y });
                }
            });

            const cylinders = order.map(id => state.cylinders[id]);
            const model = new FilterModel({
                segments,
                bedArea: cylinders.reduce((sum, c) => sum + Math.PI * c.scale.x * c.scale.z, 0) / cylinders.length,
                pondArea: Math.PI * WATER.pondRadius ** 2,
                maxPondHeight: WATER.maxPondHeight,
                maxInflow: WATER.maxInflow
            });

            // Uniformes compartidos por todos los materiales de agua
            const shared = {
                uTime: { value: 0 },
                uFront: { value: WATER.bedTop },
                uThroughput: { value: 0 },
                uSegPore: { value: new Array(SEGMENT_COUNT + 1).fill(0) },
                uSegY: { value: visualY },
                uSegC: { value: new Array(SEGMENT_COUNT + 1).fill(1) },
                uSegZ: { value: new Array(SEGMENT_COUNT).fill(0) },
                uPointScale: { value: 1 },
                uSegRadius: { value: model.segments.map(seg => seg.id ? (state.cylinders[seg.id].scale.x + state.cylinders[seg.id].scale.z) / 2 * 1.01 : 0) }
            };
            state.water = {
                model, shared, order,
                clock: new THREE.Clock(),
                elapsed: 0,
                panelUpdated: -1,
                outflowStart: null
            };

            const pmrem = new THREE.PMREMGenerator(renderer);
            const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
            pmrem.dispose();
            scene.environment = envMap;

            // Agua real: transmite y refracta lo que tiene detrás (IOR 1.33) y refleja el
            // entorno. La forma del chorro sale de la continuidad: A = Q / v, v² = v₀² + 2·g·caída.
            const waterMaterial = (params) => {
                const uniforms = {
                    uQ: { value: 0 },
                    uStreamTop: { value: params.top },
                    uSpeed: { value: params.speed || 1 },
                    uGravity: { value: params.gravity || 0 },
                    uMaxRadius: { value: params.maxRadius || 0 },
                    uIsStream: { value: params.isStream ? 1 : 0 },
                    uMaskTop: { value: 1000 },
                    uMaskBottom: { value: -1000 },
                    uFlow: { value: params.flow },
                    uRipple: { value: params.ripple }
                };
                const material = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff,
                    roughness: 0.06,
                    metalness: 0,
                    transmission: 1,
                    ior: 1.33,
                    thickness: params.thickness,
                    envMap,
                    envMapIntensity: 1.3,
                    depthWrite: false
                });
                material.userData.uniforms = uniforms;
                material.onBeforeCompile = (shader) => {
                    Object.assign(shader.uniforms, shared, uniforms);
                    shader.vertexShader = `
                        uniform float uTime;
                        uniform float uQ;
                        uniform float uStreamTop;
                        uniform float uSpeed;
                        uniform float uGravity;
                        uniform float uMaxRadius;
                        uniform float uIsStream;
                        varying vec3 vWaterPos;
                    ` + shader.vertexShader.replace('#include <begin_vertex>', `
                        #include <begin_vertex>
                        if (uIsStream > 0.5) {
                            float fall = max(uStreamTop - position.y, 0.0);
                            float speed = sqrt(uSpeed * uSpeed + 2.0 * uGravity * fall);
                            float radius = min(sqrt(uQ / (3.14159 * speed)), uMaxRadius);
                            // inestabilidad de Plateau–Rayleigh: crece con la caída
                            float growth = min(fall / 170.0, 1.0);
                            radius *= 1.0 + growth * 0.22 * sin(position.y * 0.32 + uTime * 34.0) + 0.04 * sin(position.y * 1.3 + uTime * 61.0);
                            transformed.xz = normal.xz * radius;
                        }
                        vWaterPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    `);
                    shader.fragmentShader = `
                        uniform float uTime;
                        uniform float uFlow;
                        uniform float uRipple;
                        uniform float uMaskTop;
                        uniform float uMaskBottom;
                        varying vec3 vWaterPos;
                        float waterC;
                        ${WATER_GLSL_COMMON}
                        ${WATER_GLSL_NOISE}
                    ` + shader.fragmentShader
                        .replace('#include <color_fragment>', `
                            #include <color_fragment>
                            if (vWaterPos.y > uMaskTop || vWaterPos.y < uMaskBottom) discard;
                            waterC = turbidityAt(vWaterPos.y);
                            diffuseColor.rgb = waterTint(waterC);
                        `)
                        .replace('#include <normal_fragment_maps>', `
                            #include <normal_fragment_maps>
                            vec3 rippleQ = vec3(vWaterPos.x * 0.7, (vWaterPos.y + uTime * uFlow) * 0.09, vWaterPos.z * 0.7);
                            normal = normalize(normal + uRipple * (vec3(wNoise(rippleQ), wNoise(rippleQ + 7.0), wNoise(rippleQ + 13.0)) - 0.5));
                        `)
                        // borde brillante: el agua limpia sobre fondo oscuro se ve por sus reflejos
                        .replace('#include <emissivemap_fragment>', `
                            #include <emissivemap_fragment>
                            totalEmissiveRadiance += waterTint(waterC) * pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 2.0) * mix(1.2, 0.55, waterC);
                        `)
                        // el agua con sólidos deja pasar menos luz y la dispersa
                        .replace('#include <transmission_fragment>', THREE.ShaderChunk.transmission_fragment
                            .replace('material.transmission = transmission;', 'material.transmission = transmission * (1.0 - 0.70 * waterC);'));
                };
                return material;
            };

            const stream = (top, bottom, params) => {
                const geometry = new THREE.CylinderGeometry(1, 1, top - bottom, 20, 240, true);
                geometry.translate(0, (top + bottom) / 2, 0);
                const mesh = new THREE.Mesh(geometry, waterMaterial({ top, isStream: true, ...params }));
                mesh.frustumCulled = false; // el radio real se calcula en el shader
                mesh.position.z = WATER.axisZ;
                mesh.visible = false;
                scene.add(mesh);
                return mesh;
            };

            state.water.inlet = stream(WATER.nozzleY, WATER.bedTop, {
                speed: WATER.nozzleSpeed, gravity: WATER.gravity, maxRadius: WATER.nozzleRadius - 0.5,
                flow: 320, ripple: 0.35, thickness: 3
            });
            state.water.outlet = stream(WATER.bedBottom, WATER.streamBottom, {
                speed: 4, gravity: WATER.gravity, maxRadius: WATER.pondRadius,
                flow: 320, ripple: 0.35, thickness: 3
            });
            // Hilo que cruza los huecos entre capas: el material opaco de cada capa lo tapa;
            // se ve entre capas y al caer por el hueco de una cápsula extraída.
            state.water.column = stream(WATER.bedTop, WATER.bedBottom, {
                speed: WATER.gapSpeed, maxRadius: 9, flow: 90, ripple: 0.3, thickness: 3
            });

            // Lámina de agua que la válvula mantiene sobre el lecho
            const pondGeometry = new THREE.CylinderGeometry(WATER.pondRadius, WATER.pondRadius, 1, 48);
            pondGeometry.translate(0, 0.5, 0);
            state.water.pond = new THREE.Mesh(pondGeometry, waterMaterial({ top: 0, flow: 5, ripple: 0.18, thickness: 8 }));
            state.water.pond.position.set(0, WATER.bedTop, WATER.axisZ);
            state.water.pond.visible = false;
            scene.add(state.water.pond);

            // Tubo de alimentación
            const pipe = new THREE.Mesh(
                new THREE.CylinderGeometry(WATER.nozzleRadius, WATER.nozzleRadius, 400, 40, 1, true),
                new THREE.MeshStandardMaterial({ color: 0x4a5052, roughness: 0.6, metalness: 0.2, side: THREE.DoubleSide })
            );
            pipe.position.set(0, WATER.nozzleY + 200, WATER.axisZ);
            scene.add(pipe);

            // El material de cada capa se oscurece y brilla donde ya está mojado.
            const wetUniforms = { uFront: shared.uFront };
            Object.values(state.cylinders).forEach(cyl => {
                cyl.material.onBeforeCompile = (shader) => {
                    Object.assign(shader.uniforms, wetUniforms);
                    shader.vertexShader = 'varying vec3 vWetPos;\n' + shader.vertexShader.replace('#include <begin_vertex>', `
                        #include <begin_vertex>
                        vWetPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    `);
                    shader.fragmentShader = `
                        uniform float uFront;
                        varying vec3 vWetPos;
                        ${WATER_GLSL_NOISE}
                    ` + shader.fragmentShader.replace('#include <roughnessmap_fragment>', `
                        #include <roughnessmap_fragment>
                        // frente irregular: el agua avanza primero por los poros más abiertos
                        float wetNoise = wNoise(vWetPos * vec3(0.28, 0.5, 0.28)) + 0.4 * wNoise(vWetPos * vec3(0.9, 1.4, 0.9));
                        float wet = smoothstep(uFront - 1.0, uFront + 1.0, vWetPos.y + (wetNoise - 0.7) * 6.0);
                        diffuseColor.rgb *= mix(1.0, 0.52, wet);
                        roughnessFactor = mix(roughnessFactor, 0.38, wet);
                    `);
                };
            });

            // Parcelas de agua asomando por los poros junto a la pared de cada capa
            const pointGeometry = (count) => {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
                geometry.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(count * 3).map(() => Math.random()), 3));
                return geometry;
            };
            const tracers = new THREE.Points(pointGeometry(420), new THREE.ShaderMaterial({
                vertexShader: TRACER_VERTEX,
                fragmentShader: TRACER_FRAGMENT,
                uniforms: shared,
                transparent: true,
                depthWrite: false
            }));
            tracers.frustumCulled = false;
            tracers.renderOrder = 3;
            scene.add(tracers);

            const drops = (count, uniforms) => {
                const material = new THREE.ShaderMaterial({
                    vertexShader: DROP_VERTEX,
                    fragmentShader: DROP_FRAGMENT,
                    uniforms: {
                        uTime: shared.uTime,
                        uPointScale: shared.uPointScale,
                        uCenterZ: { value: WATER.axisZ },
                        uAmount: { value: 0 },
                        ...Object.fromEntries(Object.entries(uniforms).map(([k, v]) => [k, { value: v }]))
                    },
                    transparent: true,
                    depthWrite: false
                });
                const points = new THREE.Points(pointGeometry(count), material);
                points.frustumCulled = false;
                points.renderOrder = 3;
                scene.add(points);
                return material;
            };
            state.water.splash = drops(40, {
                uRate: 2.4, uY: WATER.bedTop, uUp: 6, uDrop: 0, uSpread: 10, uSize: 1.1,
                uColor: new THREE.Color(0.8, 0.68, 0.5)
            });
            state.water.spray = drops(60, {
                uRate: 1.6, uY: WATER.bedBottom - 90, uUp: 0, uDrop: 240, uSpread: 5, uSize: 1.3,
                uColor: new THREE.Color(0.88, 0.94, 1.0)
            });

            order.forEach((id) => {
                const cyl = state.cylinders[id];
                state.rows[id].top = cyl.position.y + cyl.scale.y / 2;
            });
        }

        // "Capa 2 · Arena de sílice": la fila ya muestra el orden; el título es el material.
        function layerTitle(id) {
            return CAPSULE_DB[id].nombre.split('·')[1].trim();
        }

        // Altura visual del frente: cada segmento se recorre según su volumen de poros.
        function frontY(model, table) {
            const total = model.bedVolume;
            for (let i = 0; i < SEGMENT_COUNT; i++) {
                if (total <= table[i + 1]) {
                    const span = Math.max(table[i + 1] - table[i], 1e-3);
                    const { uSegY } = state.water.shared;
                    return THREE.MathUtils.lerp(uSegY.value[i], uSegY.value[i + 1], (total - table[i]) / span);
                }
            }
            return WATER.bedBottom;
        }

        function updateWater() {
            const w = state.water;
            const { model, shared } = w;

            // tope de dt: al volver de una pestaña oculta el modelo no da un salto
            const dt = Math.min(w.clock.getDelta(), 0.05);
            w.elapsed += dt;
            model.running = w.elapsed > 0.6;
            model.step(dt);
            if (!reducedMotion) shared.uTime.value = w.elapsed;

            // perfil del lecho para los shaders
            let pore = 0;
            model.segments.forEach((seg, i) => {
                pore += seg.poreVolume;
                shared.uSegPore.value[i + 1] = pore;
                shared.uSegZ.value[i] = seg.id ? state.cylinders[seg.id].position.z : 0;
            });
            model.turbidityProfile().forEach((c, i) => { shared.uSegC.value[i + 1] = c; });
            shared.uFront.value = frontY(model, shared.uSegPore.value);
            shared.uThroughput.value = ((model.bedVolume + model.volumeOut) / pore) % 1;

            const pondY = WATER.bedTop + model.pondHeight;
            w.pond.visible = model.pondHeight > 0.05;
            w.pond.scale.y = Math.max(model.pondHeight, 0.01);

            // chorro de entrada: su punta cae desde la boquilla
            const uIn = w.inlet.material.userData.uniforms;
            const tIn = Math.max(0, w.elapsed - 0.6);
            uIn.uQ.value = model.inflow;
            uIn.uMaskBottom.value = Math.max(pondY, WATER.nozzleY - WATER.nozzleSpeed * tIn - 0.5 * WATER.gravity * tIn * tIn);
            w.inlet.visible = model.inflow > 0;

            const uColumn = w.column.material.userData.uniforms;
            uColumn.uQ.value = model.bedFlow;
            uColumn.uMaskBottom.value = shared.uFront.value;
            w.column.visible = model.bedFlow > 0;

            // chorro de salida: mismo cálculo que el de entrada, con el caudal que sale
            if (w.outflowStart === null && model.outflow > 0) w.outflowStart = w.elapsed;
            const uOut = w.outlet.material.userData.uniforms;
            uOut.uQ.value = model.outflow;
            uOut.uSpeed.value = Math.max(model.outflow / model.bedArea, 1);
            if (w.outflowStart !== null) {
                const tOut = w.elapsed - w.outflowStart;
                uOut.uMaskBottom.value = WATER.bedBottom - 0.5 * WATER.gravity * tOut * tOut;
            }
            w.outlet.visible = model.outflow > 0;

            w.splash.uniforms.uY.value = pondY;
            // con movimiento reducido no hay gotas sueltas; el caudal y los chorros siguen
            w.splash.uniforms.uAmount.value = !reducedMotion && model.inflow > 0 ? Math.min(model.inflow / 8000, 1) * 0.7 : 0;
            w.spray.uniforms.uAmount.value = !reducedMotion && model.outflow > 0 ? Math.min(model.outflow / 8000, 1) * 0.6 : 0;

            // cada capa se enciende cuando el agua la alcanza
            w.order.forEach(id => {
                const row = state.rows[id];
                if (!row.wet && model.bedVolume > 0 && shared.uFront.value < row.top) {
                    row.wet = true;
                    row.button.classList.add('is-wet');
                }
            });

            updateFlowPanel();
        }

        function updateFlowPanel() {
            const w = state.water;
            if (w.elapsed - (w.panelUpdated || 0) < 0.2) return;
            w.panelUpdated = w.elapsed;

            const { model } = w;
            const mL = (v) => (v / 1000).toFixed(1);
            DOM.qIn.textContent = mL(model.inflow);
            DOM.qOut.textContent = mL(model.outflow);
            DOM.vIn.textContent = mL(model.volumeIn);
            DOM.vHeld.textContent = mL(model.bedVolume + model.pondHeight * model.pondArea);
            DOM.vOut.textContent = mL(model.volumeOut);

            w.order.forEach((id) => {
                const present = model.segments.find(s => s.id === id).present;
                const t = model.residenceTime(id);
                state.rows[id].time.textContent = present ? (Number.isFinite(t) ? `${t.toFixed(1)} s` : '—') : 'Fuera';
            });
        }

        function onTap(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                -((e.clientY - rect.top) / rect.height) * 2 + 1
            );

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const capsules = Object.values(state.objects).filter(o => o.name !== 'filtroMarte');
            const selectable = capsules.concat(Object.values(state.cylinders || {}));
            const hits = raycaster.intersectObjects(selectable, true);
            
            if (hits.length > 0) {
                let root = hits[0].object;
                while (root.parent && !state.objects[root.name]) root = root.parent;
                
                selectLayer(root.name);
            }
        }

        // Una sola vía para tap 3D, fila de capas, botón y Esc: tocar la capa extraída la devuelve.
        function selectLayer(id) {
            if (!state.water) return;
            const { rows } = state;
            if (state.selectedId === id) {
                // el foco no se pierde con el botón que va a ocultarse
                if (DOM.detail.contains(document.activeElement)) rows[id].button.focus({ preventScroll: true });
                state.targets[id] = 0;
                state.water.model.setLayerPresent(id, true);
                state.selectedId = null;
                DOM.live.textContent = `${layerTitle(id)} de vuelta en el filtro.`;
                DOM.detail.hidden = true;
                DOM.balance.hidden = false;
                rows[id].button.setAttribute('aria-pressed', 'false');
            } else {
                if (state.selectedId) {
                    state.targets[state.selectedId] = 0;
                    state.water.model.setLayerPresent(state.selectedId, true);
                    rows[state.selectedId].button.setAttribute('aria-pressed', 'false');
                }
                state.selectedId = id;
                state.targets[id] = state.popOut;
                state.water.model.setLayerPresent(id, false);
                rows[id].button.setAttribute('aria-pressed', 'true');

                const data = CAPSULE_DB[id];
                DOM.nombre.textContent = layerTitle(id);
                DOM.proporcion.textContent = data.proporcion;
                DOM.funcion.textContent = data.funcion;
                DOM.mecanismo.textContent = data.mecanismo;
                DOM.live.textContent = `${layerTitle(id)} fuera del filtro.`;
                DOM.balance.hidden = true;
                DOM.detail.hidden = false;
                DOM.detail.parentElement.scrollTop = 0;
            }
            state.water.panelUpdated = -1;
        }

        function returnSelected() {
            const id = state.selectedId;
            if (!id) return;
            selectLayer(id);
            state.rows[id].button.focus({ preventScroll: true });
        }

        function onResize() {
            const W = DOM.stage.clientWidth;
            const H = DOM.stage.clientHeight;
            if (!W || !H) return;
            camera.aspect = W / H;
            camera.updateProjectionMatrix();
            renderer.setSize(W, H);

            const t = Math.tan(THREE.MathUtils.degToRad(FRAME.fov / 2));
            const frame = camera.aspect < 1 ? FRAME.portrait : FRAME.wide;
            const d = FRAME.margin * Math.max(frame.halfHeight / t, FRAME.halfWidth / (t * camera.aspect));
            controls.minDistance = 0.6 * d;
            controls.maxDistance = 1.3 * d;
            const direction = camera.position.clone().sub(controls.target);
            controls.target.y = frame.targetY;
            camera.position.copy(controls.target).add(direction.setLength(d));

            // Vista de lado: la cápsula debe seguir dentro del ancho visible del visor.
            const visibleHalfWidth = d * t * camera.aspect;
            state.popOut = THREE.MathUtils.clamp(visibleHalfWidth - POP_OUT.frontEdge, POP_OUT.min, POP_OUT.max);
            if (state.selectedId) state.targets[state.selectedId] = state.popOut;

            updatePointScale();
        }

        // gl_PointSize va en píxeles físicos: la escala mantiene el tamaño de las gotas
        function updatePointScale() {
            const fov = THREE.MathUtils.degToRad(camera.fov);
            state.water.shared.uPointScale.value =
                renderer.getPixelRatio() * (DOM.stage.clientHeight / (2 * Math.tan(fov / 2))) / 1272;
        }

        // Si el teléfono no llega a unos 40 fps, baja la resolución y no la vuelve a subir.
        function adaptPixelRatio(dt) {
            if (dt > 0.5) return;
            frameStats.sum += dt;
            frameStats.count += 1;
            if (frameStats.count < 90) return;
            const slow = frameStats.sum / frameStats.count > 0.024;
            frameStats.sum = 0;
            frameStats.count = 0;
            if (!slow) return;
            const ratio = renderer.getPixelRatio();
            const next = ratio > 1.5 ? 1.5 : ratio > 1.25 ? 1.25 : ratio;
            if (next !== ratio) {
                renderer.setPixelRatio(next);
                updatePointScale();
            }
        }

        function tick() {
            requestAnimationFrame(tick);

            const dt = frameClock.getDelta();
            adaptPixelRatio(dt);
            // igual de rápido a 30 y a 120 Hz
            const ease = reducedMotion ? 1 : 1 - Math.exp(-6 * dt);

            Object.keys(state.targets).forEach(id => {
                if (state.objects[id] && id !== 'filtroMarte') {
                    state.objects[id].position.z = THREE.MathUtils.lerp(state.objects[id].position.z, state.targets[id], ease);
                    // el cilindro de material acompaña a su cápsula
                    if (state.cylinders[id]) {
                        state.cylinders[id].position.z = state.cylBaseZ[id] + state.objects[id].position.z;
                    }
                }
            });

            updateWater();

            controls.update();
            renderer.render(scene, camera);
            if (!document.body.classList.contains('ready')) {
                clearTimeout(loadWatchdog);
                document.body.classList.add('ready');
            }
        }

        try {
            init();
        } catch (error) {
            window.mykoraFail(error);
        }
    </script>
</body>
</html>
